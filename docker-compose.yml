version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: telecareplus-postgres
    environment:
      POSTGRES_DB: telecareplus
      POSTGRES_USER: ${TELECARE_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${TELECARE_DB_PASSWORD:?Set TELECARE_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - telecareplus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telecareplus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telecareplus-redis
    ports:
      - "6380:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: telecareplus-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: telecareplus-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8081:8080"
    volumes:
      - ./ops/telecareplus-realm.json:/opt/keycloak/data/import/telecareplus-realm.json
    depends_on:
      - postgres
    command: start-dev --import-realm

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telecareplus-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      TELECARE_DB_URL: ${TELECARE_DB_URL:-jdbc:postgresql://postgres:5432/telecareplus}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/telecareplus
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_ELASTICSEARCH_REPOSITORIES_ENABLED: "true"
      TELECARE_DB_USERNAME: ${TELECARE_DB_USERNAME:-postgres}
      TELECARE_DB_PASSWORD: ${TELECARE_DB_PASSWORD:?Set TELECARE_DB_PASSWORD in .env}
      TELECARE_JPA_DDL_AUTO: ${TELECARE_JPA_DDL_AUTO:-update}
      TELECARE_SHOW_SQL: ${TELECARE_SHOW_SQL:-false}
      TELECARE_JWT_SECRET: ${TELECARE_JWT_SECRET:?Set TELECARE_JWT_SECRET in .env}
      TELECARE_JWT_EXPIRATION_MS: ${TELECARE_JWT_EXPIRATION_MS:-86400000}
      TELECARE_ALLOWED_ORIGINS: ${TELECARE_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      TELECARE_OTP_DEMO_MODE: ${TELECARE_OTP_DEMO_MODE:-true}
      TELECARE_OTP_TTL_SECONDS: ${TELECARE_OTP_TTL_SECONDS:-300}
      TELECARE_SMS_ENABLED: ${TELECARE_SMS_ENABLED:-false}
      TELECARE_SMS_MODE: ${TELECARE_SMS_MODE:-mock}
      TELECARE_SMS_PROVIDER: ${TELECARE_SMS_PROVIDER:-mock}
      TELECARE_SMS_FROM: ${TELECARE_SMS_FROM:-TeleCare+}
      TELECARE_SMS_ACCOUNT_SID: ${TELECARE_SMS_ACCOUNT_SID:-}
      TELECARE_SMS_AUTH_TOKEN: ${TELECARE_SMS_AUTH_TOKEN:-}
      TELECARE_SMS_API_BASE_URL: ${TELECARE_SMS_API_BASE_URL:-https://api.twilio.com}
      TELECARE_SMS_MESSAGING_SERVICE_SID: ${TELECARE_SMS_MESSAGING_SERVICE_SID:-}
      TELECARE_EMAIL_ENABLED: ${TELECARE_EMAIL_ENABLED:-false}
      TELECARE_EMAIL_MODE: ${TELECARE_EMAIL_MODE:-mock}
      TELECARE_EMAIL_PROVIDER: ${TELECARE_EMAIL_PROVIDER:-mock}
      TELECARE_EMAIL_FROM: ${TELECARE_EMAIL_FROM:-no-reply@telecareplus.local}
      TELECARE_SMTP_HOST: ${TELECARE_SMTP_HOST:-}
      TELECARE_SMTP_PORT: ${TELECARE_SMTP_PORT:-587}
      TELECARE_SMTP_USERNAME: ${TELECARE_SMTP_USERNAME:-}
      TELECARE_SMTP_PASSWORD: ${TELECARE_SMTP_PASSWORD:-}
      TELECARE_SMTP_AUTH: ${TELECARE_SMTP_AUTH:-true}
      TELECARE_SMTP_STARTTLS: ${TELECARE_SMTP_STARTTLS:-true}
      TELECARE_WHATSAPP_ENABLED: ${TELECARE_WHATSAPP_ENABLED:-false}
      TELECARE_WHATSAPP_MODE: ${TELECARE_WHATSAPP_MODE:-mock}
      TELECARE_WHATSAPP_PROVIDER: ${TELECARE_WHATSAPP_PROVIDER:-mock}
      TELECARE_WHATSAPP_FROM: ${TELECARE_WHATSAPP_FROM:-whatsapp:+14155238886}
      TELECARE_WHATSAPP_ACCOUNT_SID: ${TELECARE_WHATSAPP_ACCOUNT_SID:-}
      TELECARE_WHATSAPP_AUTH_TOKEN: ${TELECARE_WHATSAPP_AUTH_TOKEN:-}
      TELECARE_WHATSAPP_API_BASE_URL: ${TELECARE_WHATSAPP_API_BASE_URL:-https://api.twilio.com}
      TELECARE_WHATSAPP_MESSAGING_SERVICE_SID: ${TELECARE_WHATSAPP_MESSAGING_SERVICE_SID:-}
      TELECARE_PUSH_ENABLED: ${TELECARE_PUSH_ENABLED:-true}
      TELECARE_PUSH_MODE: ${TELECARE_PUSH_MODE:-webpush}
      TELECARE_PUSH_PROVIDER: ${TELECARE_PUSH_PROVIDER:-browser}
      TELECARE_PUSH_FROM: ${TELECARE_PUSH_FROM:-TeleCare+}
      TELECARE_PUSH_SUBJECT: ${TELECARE_PUSH_SUBJECT:-mailto:alerts@telecareplus.local}
      TELECARE_PUSH_PUBLIC_KEY: ${TELECARE_PUSH_PUBLIC_KEY:?Set TELECARE_PUSH_PUBLIC_KEY in .env}
      TELECARE_PUSH_PRIVATE_KEY: ${TELECARE_PUSH_PRIVATE_KEY:?Set TELECARE_PUSH_PRIVATE_KEY in .env}
      TELECARE_TWILIO_ACCOUNT_SID: ${TELECARE_TWILIO_ACCOUNT_SID:-}
      TELECARE_TWILIO_AUTH_TOKEN: ${TELECARE_TWILIO_AUTH_TOKEN:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: telecareplus-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  telecareplus-postgres-data:
