name: TeleCare+ CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Maven Tests
        working-directory: ./backend
        run: ./mvnw test

  frontend-tests:
    name: Frontend E2E & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps
        
      - name: Run Security Audit
        working-directory: ./frontend
        run: npm audit || true # Don't fail the build on moderate vulnerabilities, but report them

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps
        
      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: npx playwright test tests/smoke.spec.js tests/accessibility-a11y.spec.js tests/network-latency.spec.js
        
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 10

  performance-tests:
    name: Load & Reliability Tests (k6)
    runs-on: ubuntu-latest
    needs: [backend-tests] # Typically run against a deployed staging environment in a real pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      # In a real scenario, you would deploy the app to staging first, then run k6 against staging.
      # For now, this step just validates that the script parses correctly.
      - name: Validate k6 script
        working-directory: ./frontend
        run: k6 inspect k6-advanced-load.js
