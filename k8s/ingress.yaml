apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telecareplus-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: telecareplus-secrets
type: Opaque
stringData:
  db-password: "changeme"
  jwt-secret: "supersecretjwtkeythatshouldbechangedinproduction"
  push-public-key: "changeme"
  push-private-key: "changeme"
