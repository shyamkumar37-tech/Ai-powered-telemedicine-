apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecare-frontend
  labels:
    app: telecare-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telecare-frontend
  template:
    metadata:
      labels:
        app: telecare-frontend
    spec:
      containers:
      - name: telecare-frontend
        image: telecareplus/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: telecare-frontend-service
spec:
  selector:
    app: telecare-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
