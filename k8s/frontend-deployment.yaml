apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecareplus-frontend
  labels:
    app: telecareplus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telecareplus-frontend
  template:
    metadata:
      labels:
        app: telecareplus-frontend
    spec:
      containers:
      - name: frontend
        image: telecareplus-frontend:1.0.0
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: telecareplus-frontend-service
spec:
  selector:
    app: telecareplus-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
