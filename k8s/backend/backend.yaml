apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: telecareplus-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: TELECARE_DB_URL
          value: "jdbc:postgresql://postgres:5432/telecareplus"
        - name: SPRING_DATA_REDIS_HOST
          value: "redis"
        - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
          value: "http://keycloak:8080/realms/telecareplus"
        - name: TELECARE_DB_USERNAME
          value: "postgres"
        - name: TELECARE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: telecareplus-secrets
              key: db-password
        - name: TELECARE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: telecareplus-secrets
              key: jwt-secret
        - name: TELECARE_PUSH_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: telecareplus-secrets
              key: push-public-key
        - name: TELECARE_PUSH_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: telecareplus-secrets
              key: push-private-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1024Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
