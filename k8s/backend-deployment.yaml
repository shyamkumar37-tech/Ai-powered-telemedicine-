apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecareplus-backend
  labels:
    app: telecareplus-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telecareplus-backend
  template:
    metadata:
      labels:
        app: telecareplus-backend
    spec:
      containers:
      - name: backend
        image: telecareplus-backend:1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/telecare"
        - name: SPRING_REDIS_HOST
          value: "redis-service"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telecareplus-backend-service
spec:
  selector:
    app: telecareplus-backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
