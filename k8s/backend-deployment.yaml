apiVersion: apps/v1
kind: Deployment
metadata:
  name: telecare-backend-blue
  labels:
    app: telecare-backend
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telecare-backend
      version: blue
  template:
    metadata:
      labels:
        app: telecare-backend
        version: blue
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: telecare-backend
        image: telecareplus/backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: telecare-db-secrets
              key: url
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: telecare-backend-service
spec:
  selector:
    app: telecare-backend
    # Switch this to 'green' during a Blue-Green deployment swap
    version: blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
