spring.datasource.url=jdbc:postgresql://localhost:5432/telecareplus_test
app.demo.seedEnabled=true

# Disable flyway for tests and rely entirely on Hibernate to create the schema.
# This prevents Flyway from running ALTER TABLE scripts before Hibernate has created the base tables.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=ThisIsASecretKeyForTestingPurposeOnlyThatIsLongEnoughToWork

spring.data.elasticsearch.repositories.enabled=false
spring.elasticsearch.uris=http://localhost:9200
