spring.application.name=telecareplus-backend

# Sentry Configuration
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=1.0

# MinIO Configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:telecare-documents}

server.port=${SERVER_PORT:8080}
spring.threads.virtual.enabled=true
spring.config.import=optional:file:.env.properties,optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${TELECARE_DB_URL:jdbc:postgresql://localhost:5432/telecareplus}
spring.datasource.username=${TELECARE_DB_USERNAME:postgres}
spring.datasource.password=${TELECARE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=${TELECARE_DB_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${TELECARE_DB_MAX_LIFETIME:1200000}
spring.jpa.hibernate.ddl-auto=${TELECARE_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${TELECARE_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${TELECARE_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${TELECARE_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${TELECARE_FLYWAY_BASELINE_VERSION:0}

app.jwt.secret=${TELECARE_JWT_SECRET:defaultSecretKeyThatIsAtLeast32BytesLong123!}
app.jwt.expiration-ms=${TELECARE_JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${TELECARE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Keycloak / OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/telecareplus}

app.auth.otp.demo-mode=${TELECARE_OTP_DEMO_MODE:true}
app.auth.otp.ttl-seconds=${TELECARE_OTP_TTL_SECONDS:300}
app.auth.otp.resend-cooldown-seconds=${TELECARE_OTP_RESEND_COOLDOWN_SECONDS:60}
app.auth.otp.max-attempts=${TELECARE_OTP_MAX_ATTEMPTS:5}
app.auth.otp.max-requests-per-window=${TELECARE_OTP_MAX_REQUESTS_PER_WINDOW:5}
app.auth.otp.request-window-seconds=${TELECARE_OTP_REQUEST_WINDOW_SECONDS:900}
app.auth.otp.sender-label=${TELECARE_OTP_SENDER_LABEL:TeleCare+}

app.ai.enabled=${TELECARE_AI_ENABLED:true}
app.ai.provider=${TELECARE_AI_PROVIDER:openai}
app.ai.api-base-url=${TELECARE_AI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.ai.api-key=${TELECARE_AI_API_KEY:}
app.ai.model=${TELECARE_AI_MODEL:gemini-1.5-flash}
app.ai.timeout-seconds=${TELECARE_AI_TIMEOUT_SECONDS:20}
app.ai.temperature=${TELECARE_AI_TEMPERATURE:0.2}

spring.ai.openai.api-key=${TELECARE_AI_API_KEY}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=${TELECARE_AI_MODEL:gemini-1.5-flash}

app.integrations.sms.enabled=${TELECARE_SMS_ENABLED:true}
app.integrations.sms.mode=${TELECARE_SMS_MODE:live}
app.integrations.sms.provider=${TELECARE_SMS_PROVIDER:twilio}
app.integrations.sms.from=${TELECARE_SMS_FROM:TeleCare+}
app.integrations.sms.account-sid=${TELECARE_SMS_ACCOUNT_SID:mock_sms_sid}
app.integrations.sms.auth-token=${TELECARE_SMS_AUTH_TOKEN:mock_sms_token}
app.integrations.sms.api-base-url=${TELECARE_SMS_API_BASE_URL:https://api.twilio.com}
app.integrations.sms.messaging-service-sid=${TELECARE_SMS_MESSAGING_SERVICE_SID:mock_sms_msid}

app.integrations.email.enabled=${TELECARE_EMAIL_ENABLED:false}
app.integrations.email.mode=${TELECARE_EMAIL_MODE:mock}
app.integrations.email.provider=${TELECARE_EMAIL_PROVIDER:mock}
app.integrations.email.from=${TELECARE_EMAIL_FROM:no-reply@telecareplus.local}

app.integrations.whatsapp.enabled=${TELECARE_WHATSAPP_ENABLED:true}
app.integrations.whatsapp.mode=${TELECARE_WHATSAPP_MODE:live}
app.integrations.whatsapp.provider=${TELECARE_WHATSAPP_PROVIDER:twilio}
app.integrations.whatsapp.from=${TELECARE_WHATSAPP_FROM:TeleCare+}
app.integrations.whatsapp.account-sid=${TELECARE_WHATSAPP_ACCOUNT_SID:mock_wa_sid}
app.integrations.whatsapp.auth-token=${TELECARE_WHATSAPP_AUTH_TOKEN:mock_wa_token}
app.integrations.whatsapp.api-base-url=${TELECARE_WHATSAPP_API_BASE_URL:https://api.twilio.com}
app.integrations.whatsapp.messaging-service-sid=${TELECARE_WHATSAPP_MESSAGING_SERVICE_SID:mock_wa_msid}

app.integrations.push.enabled=${TELECARE_PUSH_ENABLED:true}
app.integrations.push.mode=${TELECARE_PUSH_MODE:webpush}
app.integrations.push.provider=${TELECARE_PUSH_PROVIDER:browser}
app.integrations.push.from=${TELECARE_PUSH_FROM:TeleCare+}
app.integrations.push.subject=${TELECARE_PUSH_SUBJECT:mailto:alerts@telecareplus.local}
app.integrations.push.public-key=${TELECARE_PUSH_PUBLIC_KEY:}
app.integrations.push.private-key=${TELECARE_PUSH_PRIVATE_KEY:}

app.integrations.twilio.account-sid=${TELECARE_TWILIO_ACCOUNT_SID:mock_twilio_sid}
app.integrations.twilio.auth-token=${TELECARE_TWILIO_AUTH_TOKEN:mock_twilio_token}
app.observability.slow-request-threshold-ms=${TELECARE_SLOW_REQUEST_THRESHOLD_MS:500}

spring.mail.host=${TELECARE_SMTP_HOST:}
spring.mail.port=${TELECARE_SMTP_PORT:587}
spring.mail.username=${TELECARE_SMTP_USERNAME:}
spring.mail.password=${TELECARE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${TELECARE_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${TELECARE_SMTP_STARTTLS:true}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.name=TeleCare+
info.app.description=Continuous Care Telemedicine Platform
info.app.runtime=Spring Boot

resilience4j.ratelimiter.instances.medicationHistoryRateLimiter.limit-for-period=${TELECARE_MEDICATION_HISTORY_RATE_LIMIT:20}
resilience4j.ratelimiter.instances.medicationHistoryRateLimiter.limit-refresh-period=${TELECARE_MEDICATION_HISTORY_RATE_REFRESH:60s}
resilience4j.ratelimiter.instances.medicationHistoryRateLimiter.timeout-duration=0

# Resilience4j Rate Limiter Configuration
resilience4j.ratelimiter.instances.api.limitForPeriod=100
resilience4j.ratelimiter.instances.api.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.api.timeoutDuration=0

resilience4j.ratelimiter.instances.ai-services.limitForPeriod=10
resilience4j.ratelimiter.instances.ai-services.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.ai-services.timeoutDuration=5s

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
