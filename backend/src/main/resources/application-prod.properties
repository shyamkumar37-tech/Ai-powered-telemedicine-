# TeleCare+ Production Profile Configuration
# In production, Flyway SQL migrations are the sole source of database schema truth.

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.jpa.show-sql=false

# Production Security & Performance Defaults
logging.level.org.springframework.web=INFO
logging.level.com.telecareplus=INFO
