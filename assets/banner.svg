<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Decorative Grid Lines -->
  <path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  
  <!-- Cross Pulse Graphic -->
  <g transform="translate(100, 75)">
    <circle cx="75" cy="75" r="60" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3"/>
    <path d="M75 35v80M35 75h80" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <path d="M25 75h25l10-20 15 40 15-30 10 10h20" stroke="#818cf8" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="260" y="120" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="url(#textGrad)">TeleCare+</text>
  <text x="260" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#94a3b8">Enterprise AI Telemedicine &amp; Remote Care Platform</text>

  <!-- Feature Tags -->
  <g transform="translate(260, 200)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="70" y="21" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#38bdf8" text-anchor="middle">Spring Boot 3</text>

    <rect x="155" y="0" width="120" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="215" y="21" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#818cf8" text-anchor="middle">Java 21</text>

    <rect x="290" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="355" y="21" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#34d399" text-anchor="middle">React 18</text>

    <rect x="435" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="505" y="21" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#f43f5e" text-anchor="middle">HL7 FHIR R4</text>
  </g>
</svg>
