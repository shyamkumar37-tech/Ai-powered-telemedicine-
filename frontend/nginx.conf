server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Support hosting the SPA under /TeleCare+ without blank pages on deep links.
    location /TeleCare+/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /TeleCare+/ {
        try_files $uri $uri/ /index.html;
    }
}
