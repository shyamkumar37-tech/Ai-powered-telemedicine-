<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16263b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <title>TeleCare+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      #telecare-boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top left, rgba(22, 38, 59, 0.12), transparent 42%),
          radial-gradient(circle at top right, rgba(20, 184, 166, 0.12), transparent 30%),
          #f4f8fb;
        color: #16263b;
        transition: opacity 180ms ease;
        z-index: 9999;
      }

      #telecare-boot-splash[data-state="ready"] {
        opacity: 0;
        pointer-events: none;
      }

      .telecare-boot-shell {
        width: min(92vw, 560px);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 60px rgba(22, 38, 59, 0.12);
        padding: 28px 30px;
        backdrop-filter: blur(10px);
      }

      .telecare-boot-eyebrow {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #0f766e;
      }

      .telecare-boot-title {
        margin: 14px 0 10px;
        font-size: 32px;
        line-height: 1.15;
      }

      .telecare-boot-body {
        margin: 0;
        font-size: 15px;
        color: #475569;
      }

      .telecare-boot-progress {
        margin-top: 20px;
        height: 8px;
        width: 100%;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.2);
      }

      .telecare-boot-progress::after {
        content: "";
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0f766e, #14b8a6);
        animation: telecare-boot-progress 1.1s ease-in-out infinite;
      }

      .telecare-boot-skeleton {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .telecare-boot-line {
        height: 12px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }

      .telecare-boot-line.short {
        width: 60%;
      }

      .telecare-boot-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 6px;
      }

      .telecare-boot-card {
        height: 70px;
        border-radius: 18px;
        background: rgba(148, 163, 184, 0.16);
      }

      .telecare-boot-actions {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .telecare-boot-btn {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        background: #0f766e;
        color: #fff;
        cursor: pointer;
      }

      .telecare-boot-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid rgba(15, 118, 110, 0.2);
        color: #0f766e;
        background: #fff;
      }

      @keyframes telecare-boot-progress {
        from {
          transform: translateX(-115%);
        }

        to {
          transform: translateX(280%);
        }
      }
    </style>
  </head>
  <body class="bg-mist">
    <div id="telecare-boot-splash" aria-live="polite">
      <div class="telecare-boot-shell">
        <p class="telecare-boot-eyebrow">TeleCare+</p>
        <h1 class="telecare-boot-title">Setting up your care workspace</h1>
        <p class="telecare-boot-body">Loading the layout and placeholders so you never see a blank screen.</p>
        <div class="telecare-boot-skeleton" aria-hidden="true">
          <div class="telecare-boot-line"></div>
          <div class="telecare-boot-line short"></div>
          <div class="telecare-boot-grid">
            <div class="telecare-boot-card"></div>
            <div class="telecare-boot-card"></div>
            <div class="telecare-boot-card"></div>
          </div>
          <div class="telecare-boot-line"></div>
        </div>
        <div class="telecare-boot-progress" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        window.__TELECARE_LOCAL_RUNTIME__ = ["localhost", "127.0.0.1"].includes(window.location.hostname);
      })();
    </script>
    <script>
      (function () {
        window.__telecareBootError = null;
        window.addEventListener("error", function (event) {
          window.__telecareBootError = event?.error?.message || event?.message || "Unknown runtime error";
        });
        window.addEventListener("unhandledrejection", function (event) {
          const reason = event?.reason;
          window.__telecareBootError = reason?.message || String(reason || "Unhandled promise rejection");
        });

        const splash = document.getElementById("telecare-boot-splash");
        const root = document.getElementById("root");
        if (!splash) {
          return;
        }

        const hideSplash = () => {
          if (!splash || splash.getAttribute("data-state") === "ready") {
            return;
          }
          splash.setAttribute("data-state", "ready");
          splash.style.opacity = "0";
          splash.style.pointerEvents = "none";
          window.setTimeout(() => {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 220);
        };

        const isLocalHost = () => ["localhost", "127.0.0.1"].includes(window.location.hostname);
        const isNonDevPort = () => {
          if (!isLocalHost()) {
            return false;
          }
          return window.location.port !== "5173";
        };

        const computeBase = () => {
          const parts = window.location.pathname.split("/").filter(Boolean);
          if (parts.length && parts[0].toLowerCase() === "telecare+") {
            return `/${parts[0]}`;
          }
          return "";
        };

        const showFallback = () => {
          if (!splash || splash.getAttribute("data-state") === "ready") {
            return;
          }
          const title = splash.querySelector(".telecare-boot-title");
          const body = splash.querySelector(".telecare-boot-body");
          if (title) {
            title.textContent = "Unable to finish workspace setup";
          }
          if (body) {
            body.textContent = "Please reload the page or return to the login screen.";
          }

          const shell = splash.querySelector(".telecare-boot-shell");

          if (window.__telecareBootError && shell) {
            let detail = shell.querySelector(".telecare-boot-error");
            if (!detail) {
              detail = document.createElement("div");
              detail.className = "telecare-boot-error";
              detail.style.marginTop = "12px";
              detail.style.padding = "10px 12px";
              detail.style.borderRadius = "12px";
              detail.style.background = "rgba(248, 250, 252, 0.9)";
              detail.style.border = "1px solid rgba(148, 163, 184, 0.3)";
              detail.style.fontSize = "12px";
              detail.style.color = "#334155";
              shell.appendChild(detail);
            }
            detail.textContent = `Runtime error: ${window.__telecareBootError}`;
          }
          if (shell && !shell.querySelector(".telecare-boot-actions")) {
            const actions = document.createElement("div");
            actions.className = "telecare-boot-actions";

            const reload = document.createElement("button");
            reload.type = "button";
            reload.className = "telecare-boot-btn";
            reload.textContent = "Reload";
            reload.onclick = () => window.location.reload();

            const login = document.createElement("a");
            login.className = "telecare-boot-link";
            login.textContent = "Back to login";
            login.href = `${computeBase()}/login`;

            actions.appendChild(reload);
            actions.appendChild(login);

            if (isNonDevPort()) {
              const dev = document.createElement("a");
              dev.className = "telecare-boot-link";
              dev.textContent = "Open dev server";
              dev.href = `${window.location.protocol}//${window.location.hostname}:5173`;
              actions.appendChild(dev);
            }
            shell.appendChild(actions);
          }

          if (isNonDevPort()) {
            try {
              const redirectKey = "telecareplus-dev-redirected";
              if (!sessionStorage.getItem(redirectKey)) {
                sessionStorage.setItem(redirectKey, "true");
                window.setTimeout(() => {
                  window.location.href = `${window.location.protocol}//${window.location.hostname}:5173`;
                }, 1200);
              }
            } catch {
              // Ignore redirect guard failures.
            }
          }
        };

        if (root && "MutationObserver" in window) {
          const observer = new MutationObserver(() => {
            if (root.childElementCount > 0) {
              hideSplash();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }

        window.setTimeout(() => {
          if (!splash) {
            return;
          }
          if (root && root.childElementCount > 0) {
            hideSplash();
            return;
          }
          const updateBody = (text) => {
            const body = splash.querySelector(".telecare-boot-body");
            if (body) {
              body.textContent = text;
            }
          };

          if (typeof window !== "undefined" && window.__TELECARE_APP_MOUNTED__) {
            hideSplash();
            return;
          }

          if (isNonDevPort()) {
            updateBody("The app is running on the dev server. Redirecting to 5173...");
            showFallback();
            return;
          }

          fetch("/src/main.jsx", { cache: "no-store" })
            .then((response) => {
              if (!response.ok) {
                updateBody("The frontend bundle did not load. Start the Vite dev server and open http://127.0.0.1:5173.");
                showFallback();
                return;
              }
              updateBody("The app bundle loaded but the UI did not mount. Check the browser console for runtime errors.");
              showFallback();
            })
            .catch(() => {
              updateBody("The frontend bundle did not load. Start the Vite dev server and open http://127.0.0.1:5173.");
              showFallback();
            });
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
