<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16263b" />
    <title>TeleCare+ Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #f4f8fb;
        color: #102033;
        display: grid;
        place-items: center;
      }
      .card {
        max-width: 34rem;
        margin: 1.5rem;
        padding: 2rem;
        border-radius: 1.75rem;
        background: #ffffff;
        box-shadow: 0 20px 50px rgba(16, 32, 51, 0.12);
        border: 1px solid rgba(22, 38, 59, 0.08);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.6;
      }
      a {
        color: #0f766e;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p style="letter-spacing:0.3em;text-transform:uppercase;color:#0f766e;font-size:0.85rem;">TeleCare+</p>
      <h1>You are offline</h1>
      <p>The app shell is available, and previously opened pages can still load from local cache.</p>
      <p>Live actions like booking, saving records, or sending messages will sync only when internet returns.</p>
      <p><a href="/">Try reopening TeleCare+</a></p>
    </div>
  </body>
</html>
